name: Ежемесячный анализ безопасности

on:
  schedule:
    - cron: '17 8 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monthly-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Запустить полный набор тестов
        run: |
          set -uo pipefail
          mkdir -p release/qa
          set +e
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/monthly-tests.log
          test_status=${PIPESTATUS[0]}
          python3 tools/analyze-release-logs.py /tmp/monthly-tests.log \
            --source "ежемесячный запуск тестов безопасности" \
            --output release/qa/monthly-security-tests.md --fail-on-errors
          analysis_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          exit "$analysis_status"

      - name: Проверить ежемесячное подтверждение логов и трафика
        if: always()
        run: python3 tools/check-monthly-audit-evidence.py --file docs/security/monthly-audit.json --max-age-days 31

      - name: Сохранить очищенный отчёт тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panadonik-monthly-security-audit
          path: release/qa/monthly-security-tests.md
          if-no-files-found: ignore
          retention-days: 90
