name: Repository CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # FileExploresky.apk — Git LFS; без smudge тест SHA-256 читает pointer.
          # Не скачиваем стоковые LP-образы (~1.2 ГБ): юнит-тестам они не нужны.
          lfs: false

      - name: Cache Git LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: git-lfs-ci-${{ hashFiles('.gitattributes', 'prebuilt/stock-filemanager/FileExploresky.apk') }}
          restore-keys: |
            git-lfs-ci-

      - name: Fetch Git LFS objects needed for tests
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="prebuilt/stock-filemanager/FileExploresky.apk"
          if head -c 20 prebuilt/stock-filemanager/FileExploresky.apk | grep -q 'git-lfs'; then
            echo "LFS object not smudged: FileExploresky.apk" >&2
            exit 1
          fi

      - name: Run full test suite and analyze its log
        run: |
          set -euo pipefail
          bash -n build-sd.sh tools/build-release.sh tools/release-ota.sh tools/package-clean-install.sh \
            tools/extract-vendor-blobs.sh tools/prepare-build-inputs.sh apps/*/build.sh
          python3 -m json.tool obtainium-apps.json >/dev/null
          mkdir -p release/qa
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/panadonik-tests.log
          python3 tools/analyze-release-logs.py /tmp/panadonik-tests.log \
            --source "автоматические тесты" --output release/qa/test-log-analysis.md --fail-on-errors

      - name: Upload sanitized test analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-ci-${{ github.sha }}
          path: release/qa/test-log-analysis.md
          if-no-files-found: ignore
          retention-days: 30
