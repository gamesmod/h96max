name: Build and publish eMMC OTA (stable/dev)

on:
  push:
    tags:
      - 'v*'
      - 'dev-v*'
  # Ночные и ручные запуски создают кандидат как Actions artifact,
  # но не создают тег и не публикуют GitHub Release.
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'

permissions:
  contents: write

jobs:
  release:
    # Можно задать собственную метку большего GitHub-hosted runner через Actions variable.
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt attr curl e2fsprogs ffmpeg gcc-aarch64-linux-gnu gdisk git-lfs openssl python3 python3-pil unzip zip zstd
          if [ -n "${ANDROID_HOME:-}" ]; then sudo rm -rf "$ANDROID_HOME"; fi
          sudo apt-get clean
          df -h /

      - name: Run automated release tests
        run: |
          set -euo pipefail
          mkdir -p release/qa
          bash -n build-sd.sh tools/build-release.sh tools/release-ota.sh tools/package-clean-install.sh apps/*/build.sh
          python3 -m json.tool obtainium-apps.json >/dev/null
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/panadonik-tests.log
          python3 tools/analyze-release-logs.py /tmp/panadonik-tests.log \
            --source "автоматические тесты" --output release/qa/test-log-analysis.md --fail-on-errors
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then test_scope="candidate: автоматические проверки перед аппаратной приёмкой"; elif [[ "$GITHUB_REF_NAME" == dev-v* ]]; then test_scope="dev: IPTV и функциональный release gate"; else test_scope="stable: полный набор, включая конфигурацию безопасности"; fi
          cat > release/qa/automated-tests.md <<EOF
          # Автоматические проверки выпуска

          Результат: PASS ($test_scope). В CI выполнены проверка shell-синтаксиса, JSON Obtainium и выбранный набор unittest.
          EOF

      - name: Check runner disk space
        run: |
          set -euo pipefail
          available_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          # Сборка держит распакованную A12 базу, промежуточный образ и подписанный OTA.
          if [ "$available_kb" -lt 18000000 ]; then
            echo "Недостаточно места: требуется не менее 18 GB свободно. Установите Actions variable RELEASE_RUNNER на метку runner с большим диском." >&2
            exit 1
          fi

      - name: Verify tag and download private release inputs
        env:
          INPUTS_URL: ${{ secrets.RELEASE_INPUTS_ARCHIVE_URL }}
          INPUTS_SHA256: ${{ secrets.RELEASE_INPUTS_SHA256 }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ro.tvbox.release=//p' build-sd.sh)"
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then tag_version="$version"; elif [[ "$GITHUB_REF_NAME" == dev-v* ]]; then tag_version="${GITHUB_REF_NAME#dev-v}"; else tag_version="${GITHUB_REF_NAME#v}"; fi
          test "$tag_version" = "$version" || { echo "Tag does not match firmware version" >&2; exit 1; }
          test -n "$INPUTS_URL" && test -n "$INPUTS_SHA256" || { echo "Configure RELEASE_INPUTS_ARCHIVE_URL and RELEASE_INPUTS_SHA256 repository secrets" >&2; exit 1; }
          echo "::add-mask::$INPUTS_URL"
          curl --fail --location --retry 3 --silent --show-error "$INPUTS_URL" --output /tmp/release-inputs.tar.zst
          printf '%s  %s\n' "$INPUTS_SHA256" /tmp/release-inputs.tar.zst | sha256sum --check --status
          tar --zstd -xf /tmp/release-inputs.tar.zst -C .
          rm /tmp/release-inputs.tar.zst
          test -f dl/a12/Image/lp/system.img
          test -f dl/a12/Image/lp/vendor.img
          test -f dl/a12/MiniLoaderAll.bin
          test -f dl/apk/com.tvlauncher.apk
          test -f dl/webview/webview-arm64.apk
          test -f dl/torrserver/TorrServer-android-arm64
          test -f a9fw/fw_bcm4334b1_ag.bin
          test -f stock/vfd/vfdsrv
          test -f overlay-wifi/TvboxWifiOverlay.apk

      - name: Load existing signing keys
        env:
          TVBOX_KEY: ${{ secrets.TVBOX_SIGNING_KEY }}
          TVBOX_CERT: ${{ secrets.TVBOX_SIGNING_CERT }}
          OTA_KEY: ${{ secrets.OTA_SIGNING_KEY }}
          OTA_CERT: ${{ secrets.OTA_SIGNING_CERT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p secrets
          test -n "$TVBOX_KEY" && test -n "$TVBOX_CERT" && test -n "$OTA_KEY" && test -n "$OTA_CERT"
          printf '%s\n' "$TVBOX_KEY" > secrets/tvbox-key.pem
          printf '%s\n' "$TVBOX_CERT" > secrets/tvbox-cert.pem
          printf '%s\n' "$OTA_KEY" > secrets/ota-key.pem
          printf '%s\n' "$OTA_CERT" > secrets/ota-cert.pem

      - name: Generate notes for the installer
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ro.tvbox.release=//p' build-sd.sh)"
          mkdir -p release/notes
          if [ -s "release/notes/$version.txt" ]; then
            echo "Using committed release notes"
          elif [ -s "docs/release-notes/$version.md" ]; then
            cp "docs/release-notes/$version.md" "release/notes/$version.txt"
          else
            previous="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
            if [ -n "$previous" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "$previous..$GITHUB_SHA" > "release/notes/$version.txt"
            else
              git log --no-merges --pretty=format:'- %s (%h)' -20 "$GITHUB_SHA" > "release/notes/$version.txt"
            fi
          fi
          test -s "release/notes/$version.txt"

      - name: Build and verify a public IPTV list
        run: |
          set -euo pipefail
          python3 -I tools/check-public-release.py --sources tools/iptv-sources.txt
          python3 -I tools/iptv-merge.py --out overlay/system/etc/tvbox/iptv.m3u
          python3 -I tools/check-public-release.py --sources tools/iptv-sources.txt --playlist overlay/system/etc/tvbox/iptv.m3u --min-adult 20

      - name: Build signed OTA
        run: |
          set -euo pipefail
          tools/setup-sdk.sh
          set +e
          tools/build-release.sh 2>&1 | tee /tmp/panadonik-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          python3 tools/analyze-release-logs.py /tmp/panadonik-build.log \
            --source "сборка OTA" --output release/qa/build-log-analysis.md --fail-on-errors
          test "$build_status" -eq 0
          test ! -e secrets/wifi.env
          python3 tools/check-image-wifi-secrets.py build/work/system.img build/work/vendor.img
          mkdir -p release/obtainium
          cp apps/antivirus/out/TvboxAntivirus.apk release/obtainium/Panadonik-antivirus.apk
          cp apps/bootlog/out/TvboxBootLog.apk release/obtainium/Panadonik-bootlog.apk
          cp apps/clean/out/TvboxClean.apk release/obtainium/Panadonik-performance.apk
          cp apps/installer/out/TvboxInstaller.apk release/obtainium/Panadonik-installer.apk
          cp apps/iptv/out/TvboxIptv.apk release/obtainium/Panadonik-iptv.apk
          cp apps/links/out/TvboxLinks.apk release/obtainium/Panadonik-links.apk
          cp apps/power/out/TvboxPower.apk release/obtainium/Panadonik-power.apk
          version="$(sed -n 's/^ro.tvbox.release=//p' build-sd.sh)"
          cp release/updates/emmc/latest.txt release/updates/emmc/latest-emmc.txt
          cd release/updates/emmc
          sha256sum "tvbox-update-$version-emmc.zip" latest-emmc.txt > SHA256SUMS

      - name: Require target-device release evidence
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ro.tvbox.release=//p' build-sd.sh)"
          if [[ "$GITHUB_REF_NAME" == dev-v* ]]; then channel=dev; else channel=stable; fi
          cp "docs/release-qa/$version.json" release/qa/device-evidence.json
          python3 tools/check-release-evidence.py --file "docs/release-qa/$version.json" --version "$version" --channel "$channel"

      - name: Record candidate-only status (non-tag build)
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ro.tvbox.release=//p' build-sd.sh)"
          cat > release/qa/candidate-status.md <<EOF
          # Panadonik $version — build candidate

          - Source commit: `$GITHUB_SHA`.
          - Automated tests and package build completed in GitHub Actions.
          - This manual build has not passed the target-device release gate. Boot time, logs, network capture, IPTV, QR, torrent playback, and graphics remain unverified by this workflow.
          - Do not treat this artifact as a public release. Before installing, complete hardware checks and obtain explicit user confirmation for any operation that wipes data.
          EOF

      - name: Upload QA reports, including failed release attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panadonik-release-qa-${{ github.ref_name }}
          path: |
            release/qa/*.md
            release/qa/device-evidence.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload signed build candidate (nightly/manual run)
        if: github.event_name != 'push' && success()
        uses: actions/upload-artifact@v4
        with:
          name: panadonik-candidate-${{ github.sha }}
          path: |
            release/updates/emmc/tvbox-update-*.zip
            release/updates/emmc/latest-emmc.txt
            release/updates/emmc/SHA256SUMS
            release/Panadonik-*-emmc-clean-install.zip
            release/Panadonik-*-emmc-clean-install.zip.sha256
            release/Panadonik-*-emmc-clean-install.zip.sig
            release/Panadonik-*-ota-cert.pem
            release/obtainium/*.apk
            release/qa/automated-tests.md
            release/qa/test-log-analysis.md
            release/qa/build-log-analysis.md
            release/qa/candidate-status.md
          if-no-files-found: error
          retention-days: 3

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == dev-v* ]]; then version="${GITHUB_REF_NAME#dev-v}"; channel=dev; else version="${GITHUB_REF_NAME#v}"; channel=stable; fi
          title="Panadonik $version"
          release_args=()
          if [[ "$channel" == dev ]]; then title+=" (dev)"; release_args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "release/updates/emmc/tvbox-update-$version-emmc.zip" \
            release/updates/emmc/latest-emmc.txt \
            release/updates/emmc/SHA256SUMS \
            release/Panadonik-$version-emmc-clean-install.zip \
            release/Panadonik-$version-emmc-clean-install.zip.sha256 \
            release/Panadonik-$version-emmc-clean-install.zip.sig \
            release/Panadonik-$version-ota-cert.pem \
            release/obtainium/*.apk \
            release/qa/automated-tests.md \
            release/qa/test-log-analysis.md \
            release/qa/build-log-analysis.md \
            release/qa/device-evidence.json \
            --title "$title" \
            --generate-notes "${release_args[@]}"
